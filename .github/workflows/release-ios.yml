name: Release iOS

# Disabled: iOS builds require Apple Developer signing (Team ID, certificates,
# provisioning profiles) configured as GitHub secrets. Enable this workflow
# after setting up signing by uncommenting the trigger below.
#
# To configure:
#   1. Add APPLE_DEVELOPMENT_TEAM secret (Team ID)
#   2. Add signing certificate and provisioning profile secrets
#   3. Uncomment the 'on' trigger below
on:
  workflow_dispatch: # Manual trigger only until signing is configured
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: write

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ios:
    name: iOS Release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

      - name: Build iOS
        # Note: Building for iOS device requires signing identities.
        # Fails without valid Apple Development Team ID.
        # Configure signing secrets before treating this workflow as a production release gate.
        run: |
          pnpm tauri ios build --export-method release-testing

      - name: Upload iOS Artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/gen/apple/build/ipa/*.ipa
