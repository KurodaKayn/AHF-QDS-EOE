name: Release iOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-ios:
    name: iOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Next.js
        run: pnpm run build

      - name: Build iOS
        # Note: Building for iOS device requires signing identities.
        # Fails without valid Apple Development Team ID.
        # We attempt to build, but it may fail in CI without secrets.
        continue-on-error: true
        run: |
          pnpm tauri ios build --export-method ad-hoc || echo "iOS build failed or requires signing configuration"

      - name: Upload iOS Artifact
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/gen/apple/build/ipa/*.ipa
