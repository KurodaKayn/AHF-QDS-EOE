  <rect x="275" y="75" width="160" height="58" rx="8" class="node"/><text x="355" y="99" text-anchor="middle" class="label">BankSelector</text><text x="355" y="117" text-anchor="middle" class="sub">选择/新建题库</text>
  <rect x="500" y="75" width="160" height="58" rx="8" class="node"/><text x="580" y="99" text-anchor="middle" class="label">QuestionList</text><text x="580" y="117" text-anchor="middle" class="sub">搜索/排序/重复题</text>
  <rect x="725" y="75" width="160" height="58" rx="8" class="green"/><text x="805" y="99" text-anchor="middle" class="label">QuestionForm</text><text x="805" y="117" text-anchor="middle" class="sub">新增/编辑/校验</text>
  <rect x="160" y="235" width="180" height="62" rx="8" class="green"/><text x="250" y="259" text-anchor="middle" class="label">useQuestionForm</text><text x="250" y="277" text-anchor="middle" class="sub">题型/选项/答案</text>
