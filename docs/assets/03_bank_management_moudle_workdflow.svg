  <rect x="285" y="380" width="180" height="62" rx="8" class="purple"/><text x="375" y="404" text-anchor="middle" class="label">Tauri quiz.rs</text><text x="375" y="422" text-anchor="middle" class="sub">snapshot 返回</text>
