    .label { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; fill: #6b7280; }
    .lane { fill-opacity: 0.08; stroke-width: 1.2; stroke-dasharray: 6 4; }
    .node { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
  </style>
  <defs>
