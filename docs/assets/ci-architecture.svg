<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">AHF QDS EOE CI Architecture</title>
  <desc id="desc">GitHub Actions CI architecture showing pull request quality gates, build checks, and tagged release packaging workflows.</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      fill: #111827;
    }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .section-title { font-size: 15px; font-weight: 700; }
    .node-title { font-size: 14px; font-weight: 700; }
    .node-subtitle { font-size: 12px; fill: #6b7280; }
    .tiny { font-size: 11px; fill: #6b7280; }
    .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .lane { fill: #f9fafb; stroke: #e5e7eb; stroke-width: 1.5; stroke-dasharray: 6 6; }
    .trigger { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
    .gate { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .build { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.5; }
    .release { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; }
    .done { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.5; }
    .primary-line { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
    .build-line { stroke: #9333ea; stroke-width: 2; fill: none; marker-end: url(#arrow-purple); }
    .release-line { stroke: #ea580c; stroke-width: 2; fill: none; marker-end: url(#arrow-orange); }
    .control-line { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="60" y="54" class="title">AHF QDS EOE CI Architecture</text>
  <text x="60" y="78" class="subtitle">Quality gates before merge, independent build checks, and tag-triggered release packaging.</text>

  <rect x="50" y="110" width="1100" height="345" rx="14" class="lane"/>
  <text x="76" y="142" class="section-title">Pull Request and Main Branch CI</text>
  <text x="76" y="164" class="subtitle">.github/workflows/ci.yml</text>

  <rect x="80" y="205" width="150" height="78" rx="10" class="trigger"/>
  <circle cx="108" cy="244" r="18" fill="#dcfce7" stroke="#86efac"/>
  <path d="M101 244h14M108 237v14" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <text x="138" y="237" class="node-title">Trigger</text>
  <text x="138" y="257" class="node-subtitle">PR or main push</text>

  <rect x="280" y="185" width="170" height="118" rx="10" class="gate"/>
  <rect x="300" y="205" width="30" height="30" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <path d="M308 221l5 5 10-13" stroke="#2563eb" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="345" y="219" class="node-title">Verify</text>
  <text x="345" y="239" class="node-subtitle">Install frozen deps</text>
  <text x="345" y="259" class="node-subtitle">Lint and test</text>
  <text x="345" y="279" class="node-subtitle">TypeScript check</text>

  <rect x="500" y="140" width="180" height="78" rx="10" class="build"/>
  <rect x="520" y="160" width="30" height="30" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <path d="M526 184h18M529 176h12M532 168h6" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
  <text x="565" y="172" class="node-title">Web Build</text>
  <text x="565" y="193" class="node-subtitle">pnpm build</text>

  <rect x="500" y="270" width="180" height="78" rx="10" class="build"/>
  <rect x="520" y="290" width="30" height="30" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <path d="M527 305h16M535 297v16M527 313h16" stroke="#9333ea" stroke-width="2" stroke-linecap="round"/>
  <text x="565" y="302" class="node-title">Rust Check</text>
  <text x="565" y="323" class="node-subtitle">cargo check --locked</text>

  <rect x="750" y="205" width="170" height="78" rx="10" class="done"/>
  <circle cx="778" cy="244" r="18" fill="#fef3c7" stroke="#fcd34d"/>
  <path d="M770 244l6 6 12-15" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="808" y="237" class="node-title">Merge Ready</text>
  <text x="808" y="257" class="node-subtitle">All gates passed</text>

  <rect x="960" y="205" width="150" height="78" rx="10" class="box"/>
  <rect x="980" y="225" width="30" height="30" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <path d="M987 241h16M995 233v16" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <text x="1025" y="237" class="node-title">Main</text>
  <text x="1025" y="257" class="node-subtitle">Protected branch</text>

  <path d="M230 244H280" class="primary-line"/>
  <path d="M450 244C480 244 470 179 500 179" class="build-line"/>
  <path d="M450 244C480 244 470 309 500 309" class="build-line"/>
  <path d="M680 179C720 179 710 244 750 244" class="build-line"/>
  <path d="M680 309C720 309 710 244 750 244" class="build-line"/>
  <path d="M920 244H960" class="control-line"/>

  <rect x="112" y="370" width="850" height="48" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="136" y="392" class="tiny">Verify sequence:</text>
  <text x="226" y="392" class="tiny">pnpm lint</text>
  <text x="326" y="392" class="tiny">pnpm test:regression</text>
  <text x="491" y="392" class="tiny">pnpm test:unit</text>
  <text x="620" y="392" class="tiny">pnpm typecheck</text>
  <text x="136" y="411" class="tiny">Build checks run after verify to keep the first failure signal fast and clear.</text>

  <rect x="50" y="500" width="1100" height="190" rx="14" class="lane"/>
  <text x="76" y="532" class="section-title">Tagged Release Workflows</text>
  <text x="76" y="554" class="subtitle">Release jobs run on v* tags and install dependencies with frozen lockfiles.</text>

  <rect x="80" y="590" width="150" height="62" rx="10" class="trigger"/>
  <text x="111" y="615" class="node-title">v* Tag</text>
  <text x="111" y="636" class="node-subtitle">Release trigger</text>

  <rect x="310" y="578" width="170" height="86" rx="10" class="release"/>
  <text x="342" y="606" class="node-title">Desktop Release</text>
  <text x="342" y="627" class="node-subtitle">macOS dmg</text>
  <text x="342" y="647" class="node-subtitle">Windows nsis</text>

  <rect x="530" y="578" width="170" height="86" rx="10" class="release"/>
  <text x="568" y="606" class="node-title">Android Release</text>
  <text x="568" y="627" class="node-subtitle">APK artifacts</text>
  <text x="568" y="647" class="node-subtitle">NDK and Rust targets</text>

  <rect x="750" y="578" width="170" height="86" rx="10" class="release"/>
  <text x="795" y="606" class="node-title">iOS Release</text>
  <text x="795" y="627" class="node-subtitle">IPA artifacts</text>
  <text x="795" y="647" class="node-subtitle">Fails without signing</text>

  <rect x="970" y="590" width="140" height="62" rx="10" class="done"/>
  <text x="1004" y="615" class="node-title">GitHub</text>
  <text x="1004" y="636" class="node-subtitle">Draft release</text>

  <path d="M230 621H310" class="release-line"/>
  <path d="M230 621C260 621 270 621 300 621M480 621H530" class="release-line"/>
  <path d="M700 621H750" class="release-line"/>
  <path d="M920 621H970" class="release-line"/>

  <rect x="60" y="710" width="370" height="28" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <line x1="80" y1="724" x2="120" y2="724" class="primary-line"/>
  <text x="132" y="728" class="tiny">Quality gate</text>
  <line x1="230" y1="724" x2="270" y2="724" class="build-line"/>
  <text x="282" y="728" class="tiny">Build check</text>
  <line x1="350" y1="724" x2="390" y2="724" class="release-line"/>
  <text x="402" y="728" class="tiny">Release packaging</text>
</svg>
