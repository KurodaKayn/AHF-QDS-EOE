<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.title{font-size:18px;font-weight:700}.label{font-size:13px;font-weight:600}.sub{font-size:11px;fill:#6b7280}.node{fill:#fff;stroke:#d1d5db;stroke-width:1.5}.blue{fill:#eff6ff;stroke:#bfdbfe}.green{fill:#f0fdf4;stroke:#bbf7d0}.purple{fill:#faf5ff;stroke:#e9d5ff}.orange{fill:#fff7ed;stroke:#fed7aa}.red{fill:#fef2f2;stroke:#fecaca}</style>
  <defs><marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#9333ea"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker></defs>
  <rect width="960" height="540" fill="#fff"/><text x="30" y="34" class="title">导入导出模块数据流</text>
  <rect x="50" y="80" width="160" height="60" rx="8" class="blue"/><text x="130" y="103" text-anchor="middle" class="label">CSV/XLSX 文件</text><text x="130" y="122" text-anchor="middle" class="sub">File input / Save dialog</text>
  <rect x="270" y="80" width="160" height="60" rx="8" class="green"/><text x="350" y="103" text-anchor="middle" class="label">useImportExport</text><text x="350" y="122" text-anchor="middle" class="sub">导入/导出编排</text>
  <rect x="490" y="80" width="170" height="60" rx="8" class="purple"/><text x="575" y="103" text-anchor="middle" class="label">importExportService</text><text x="575" y="122" text-anchor="middle" class="sub">运行时适配</text>
  <polygon points="760,80 845,110 760,140 675,110" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/><text x="760" y="115" text-anchor="middle" class="label">Tauri?</text>
  <rect x="170" y="245" width="180" height="62" rx="8" class="orange"/><text x="260" y="269" text-anchor="middle" class="label">浏览器解析/下载</text><text x="260" y="288" text-anchor="middle" class="sub">xlsx + Blob</text>
  <rect x="430" y="245" width="180" height="62" rx="8" class="purple"/><text x="520" y="269" text-anchor="middle" class="label">Rust file_io.rs</text><text x="520" y="288" text-anchor="middle" class="sub">bytes -&gt; QuestionBank</text>
